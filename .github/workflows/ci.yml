name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  proto-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protobuf definitions
        run: buf lint

      - name: Check breaking changes against main
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            buf breaking --against '.git#ref=origin/main'
          else
            echo "Skipping breaking check: origin/main not available."
          fi

      - name: Verify package versions are synchronized
        run: ./scripts/check-version-sync.sh

  compile-rust:
    runs-on: ubuntu-latest
    needs: proto-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Rust code
        run: ./scripts/generate.sh rust

      - name: Compile Rust crate
        run: cargo check --manifest-path packages/rust/lirays-scada-proto/Cargo.toml

  compile-python:
    runs-on: ubuntu-latest
    needs: proto-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate Python code
        run: ./scripts/generate.sh python

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          rm -rf packages/python/lirays-scada-proto/dist
          python -m build packages/python/lirays-scada-proto

      - name: Import test
        run: |
          python -m pip install packages/python/lirays-scada-proto/dist/*.whl
          python - <<'PY'
          import namespace.commands_pb2
          import namespace.enums_pb2
          import namespace.events_pb2
          import namespace.types_pb2
          print("Python protobuf modules import successfully")
          PY

  compile-js:
    runs-on: ubuntu-latest
    needs: proto-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate JS code
        run: ./scripts/generate.sh js

      - name: Install JS dependencies
        working-directory: packages/js/lirays-scada-proto
        run: npm install

      - name: Build JS package
        working-directory: packages/js/lirays-scada-proto
        run: npm run build

      - name: Package dry run
        working-directory: packages/js/lirays-scada-proto
        run: npm pack --dry-run
