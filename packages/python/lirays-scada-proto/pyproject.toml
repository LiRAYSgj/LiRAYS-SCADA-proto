[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lirays-scada-proto"
version = "0.1.3"
description = "Generated protobuf types for LiRAYS SCADA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LiRAYS" }]
dependencies = [
  "protobuf>=5.27,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
