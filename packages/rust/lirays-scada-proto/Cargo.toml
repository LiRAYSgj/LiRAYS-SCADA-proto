[package]
name = "lirays-scada-proto"
version = "0.1.1"
edition = "2021"
description = "Generated protobuf types for LiRAYS SCADA"
readme = "README.md"
license = "MIT"
repository = "https://github.com/lirays/LiRAYS-SCADA-proto"
include = [
  "Cargo.toml",
  "README.md",
  "build.rs",
  "src/**",
  "proto/**",
]

[lib]
name = "lirays_scada_proto"
path = "src/lib.rs"

[dependencies]
prost = "0.14"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
walkdir = "2"
